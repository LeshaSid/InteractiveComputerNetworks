<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Интерактивный курс «Компьютерные сети» — теория, лабораторные работы, тесты и симулятор Cisco IOS">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Компьютерные сети — интерактивный курс">
<meta property="og:description" content="Теория, лабораторные, тесты, симуляторы Cisco IOS и Packet Tracer прямо в браузере">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<title>Компьютерные сети — интерактивный курс</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<div class="app">

  <!-- ===== Боковое меню ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a href="#/" class="brand">
        <span class="brand-icon">🌐</span>
        <span class="brand-text">Компьютерные<br>сети</span>
      </a>
      <button class="sidebar-close" id="sidebarClose" aria-label="Закрыть меню">✕</button>
    </div>
    <nav class="nav" id="nav"><!-- заполняется app.js --></nav>
    <div class="sidebar-foot">
      <div class="progress-actions">
        <button class="foot-btn" id="btnExport" title="Скачать прогресс файлом">💾 Экспорт</button>
        <button class="foot-btn" id="btnImport" title="Загрузить прогресс из файла">📂 Импорт</button>
        <button class="foot-btn foot-danger" id="btnReset" title="Сбросить весь прогресс">🗑 Сброс</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <button class="theme-toggle" id="themeToggle">
        <span class="theme-icon">🌙</span><span class="theme-label">Тёмная тема</span>
      </button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ===== Основная область ===== -->
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Поиск по курсу… (Ctrl+K)" autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="topbar-progress" id="topbarProgress" title="Общий прогресс"></div>
    </header>

    <main class="content" id="content" tabindex="-1">
      <!-- страницы рендерятся сюда -->
    </main>

    <footer class="footer">
      <span>Интерактивный курс по компьютерным сетям</span>
      <span class="footer-sep">·</span>
      <a href="#/about">О проекте</a>
    </footer>
  </div>
</div>

<script>
/* PWA: регистрируем SW только по http(s), не через file:// */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
